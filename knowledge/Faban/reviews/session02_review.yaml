- id: event-002
  sequence: 4
  source_type: db_event
  source_text: They set out for the Fey Wilds, traveling through the city and encountering
    a blacksmith.
  decision: corrected
  canonical_text: On Apollal 12, the party leaves Bentrios for the Fey Wilds, seeing
    how the city's machinery has failed and older practices like sundials and oil
    lamps have returned; along the road they encounter a blacksmith trying to rouse
    a failed warforged, and he tells them Urgan's Axe was crafted by dwarves a millennium
    ago.
  event_type: travel
  location: Bentrios
  significance: 4
  reason: This captures the travel departure, the altered state of Bentrios, and a
    key clue about Urgan's Axe.
  decided_by: codex
  decided_on: '2026-05-05'
  applied_status: applied
  applied_on: '2026-05-05'
- id: event-003
  sequence: 6
  source_type: db_event
  source_text: They meet Oak, a dryad, who agrees to help them in exchange for their
    vow of silence on where the axe is located.
  decision: corrected
  canonical_text: Near the outer Fey Woods, Faban tries to light a fire while the
    party discusses blazing a trail, and a nearby tree strikes him; the tree is Oak,
    a dryad, who says she is bound by a vow of silence about the axe but warns that
    fey are hostile to outsiders.
  event_type: social
  location: Fey Woods
  significance: 4
  reason: Oak is an important first Fey Woods contact and source of guidance.
  decided_by: codex
  decided_on: '2026-05-05'
  applied_status: applied
  applied_on: '2026-05-05'
