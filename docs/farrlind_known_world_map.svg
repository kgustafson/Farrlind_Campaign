    <circle class="city" cx="170" cy="540" r="46"/>
    <circle class="wild" cx="300" cy="280" r="48"/>
    <circle class="wild" cx="520" cy="280" r="50"/>
    <circle class="wild" cx="676" cy="380" r="44"/>
    <circle class="city" cx="830" cy="510" r="48"/>
    <circle class="roadnode" cx="860" cy="740" r="54"/>
    <circle class="danger" cx="1040" cy="625" r="50"/>
    <circle class="roadnode" cx="940" cy="430" r="46"/>
