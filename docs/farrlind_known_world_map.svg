<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Farrlind Known World Map - Canon Draft</title>
  <desc id="desc">A schematic campaign travel map from Bentrios through the Fey Woods, Thataways, Bellemaine, the Archaeological Dig Site, Druid Retreat, Paramon, Balrog, and the Coast near Catur.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f5144"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8f8c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4d3f31" flood-opacity="0.22"/>
    </filter>
    <style>
      .bg { fill: #f4ecd5; }
      .sea { fill: #bdd6dc; opacity: 0.55; }
      .coast { fill: none; stroke: #7ca6ad; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 10; opacity: 0.8; }
      .mountain { fill: #d5d0c1; stroke: #8a8170; stroke-width: 2; }
      .forest { fill: #c9ddb8; stroke: #6f8e5f; stroke-width: 2; opacity: 0.85; }
      .road { fill: none; stroke: #5f5144; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
      .road-medium { fill: none; stroke: #8b8f8c; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 12 10; marker-end: url(#arrow-dim); }
      .portal { fill: none; stroke: #5b6e9b; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 6 8; marker-end: url(#arrow); }
      .nearby { fill: none; stroke: #8b8f8c; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6 8; marker-end: url(#arrow-dim); }
      .label { font-family: ui-serif, Georgia, serif; fill: #2d281f; font-size: 20px; font-weight: 700; }
      .small { font-family: ui-sans-serif, system-ui, sans-serif; fill: #4d463b; font-size: 13px; }
      .tiny { font-family: ui-sans-serif, system-ui, sans-serif; fill: #5d554a; font-size: 12px; }
      .route-label { font-family: ui-sans-serif, system-ui, sans-serif; fill: #3f382f; font-size: 12px; font-weight: 650; }
      .unknown { font-family: ui-sans-serif, system-ui, sans-serif; fill: #766c5f; font-size: 14px; font-style: italic; }
      .city { fill: #f9f3df; stroke: #7b633d; stroke-width: 3; }
      .wild { fill: #e4f0df; stroke: #4d7c59; stroke-width: 3; }
      .danger { fill: #f3e1df; stroke: #9a4d48; stroke-width: 3; }
      .roadnode { fill: #eef1f4; stroke: #687382; stroke-width: 3; }
      .badge { fill: #fffaf0; stroke: #c8b98e; stroke-width: 1.5; }
      .title { font-family: ui-serif, Georgia, serif; fill: #2d281f; font-size: 38px; font-weight: 800; }
      .subtitle { font-family: ui-sans-serif, system-ui, sans-serif; fill: #5d554a; font-size: 16px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="980"/>
  <path class="sea" d="M1160,0 C1120,120 1190,210 1160,330 C1128,458 1228,548 1198,682 C1172,800 1228,900 1210,980 L1500,980 L1500,0 Z"/>
  <path class="coast" d="M1135,25 C1094,119 1157,210 1127,325 C1092,455 1185,548 1152,675 C1126,770 1166,864 1150,950"/>

  <ellipse class="forest" cx="342" cy="310" rx="230" ry="150"/>
  <ellipse class="forest" cx="565" cy="375" rx="140" ry="90"/>
  <path class="mountain" d="M790,405 l44,-86 l46,86 z"/>
  <path class="mountain" d="M858,415 l52,-110 l58,110 z"/>
  <path class="mountain" d="M930,430 l43,-82 l50,82 z"/>
  <path class="mountain" d="M858,520 l46,-91 l52,91 z"/>

  <text class="title" x="70" y="72">Farrlind Known World</text>
  <text class="subtitle" x="72" y="100">Canon travel schematic through Session 20. Geography is approximate; routes are reviewed campaign truth.</text>

  <!-- Routes -->
  <path class="road" d="M185,510 C205,430 228,365 268,314"/>
