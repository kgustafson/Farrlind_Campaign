  <text class="label" x="92" y="825">Known but not yet placed</text>
  <text class="unknown" x="94" y="852">Henedal - across the sea, birthplace of magic</text>
  <text class="unknown" x="94" y="876">Monastery of the Open Hand - in the Gale</text>
