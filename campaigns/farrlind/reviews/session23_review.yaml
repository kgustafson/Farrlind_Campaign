final_summary:
  session_title: Onward to Gale
  real_world_date: '2026-07-06'
  in_world_date: July 5th
  starting_location: Catur
  ending_location: Outside the Gale
  key_locations: The Gale
  major_outcome: ''
  summary_markdown: "The session started with Faban calling the party over for a talk\
    \ while still in Catur. Faban revealed that he has been carrying a powerful artifact,\
    \ \"Grimoire Mutandi Und Sciencetia et Memoria\".  it is tied to knowledge and\
    \ memory, and the danger of wielding it, as speaking absolute truth can rewrite\
    \ reality. They also discussed the motivations of infernal forces and Salazar,\
    \ who seeks a hostile takeover of the realms.\r\n\r\nLater the queen asked if\
    \ there is anything that the party could want for saving the realm.  Corvinas\
    \ asked for shield and picked out the *Sentinel Shield*. Brigit visited the fletcher\
    \ and picked out winged arrows, Gildas asked for a scroll of dispell magic so\
    \ he could add that spell to his spell book and was given the means to do the\
    \ copying. Mikani asked for a bag of gems and picked from it the finest diamonds\
    \ for a spell component.  Roon asked for winged boots.  I asked for an alchemy\
    \ jug and a passage to the Gale.\r\n\r\nA ritual was performed and a magical portal\
    \ opened.\r\n\r\nThe party then explored The Gale, which is described as a region\
    \ of torrentious winds and snow, almost a portal to the elemental plane of air.\
    \  Mikani communed with nature and discovered a nearby settlement.  Roon, in the\
    \ meantime decided to test out his boots and flew high into the sky to look over\
    \ the gale.  He encountered a white dragon emerging from the snowy swirls, leading\
    \ to a confrontation where the dragon dealt damage to Roon.  Roon returned to\
    \ the ground. They discussed the possibility that the dragon might be a protector\
    \ of the monastery or the well.\r\n\r\nAs they traveled to the settlement, the\
    \ party discussed the history of white dragons, referencing a song from Norhundra\
    \ about a ruthless white dragon defeated there. They learned that the area was\
    \ home to various elemental beings, including Ice Methods, Air Elementals, Pyramidons,\
    \ and Myrmidons.\r\n\r\nThe party then sought directions from a cartographer named\
    \ Joshua, who provided a rough map showing the path to the monastery, noting that\
    \ it would take at least two days due to the treacherous terrain. The journey\
    \ through The Gale  would be fraught with danger, as the party discussed the necessity\
    \ of being stealthy when traveling, noting that the area was monitored by patrols\r\
    \n\r\nThe session concluded with the party discussing the nature of the elemental\
    \ beings and the patrols, and the general safety of the area, while seeking to\
    \ reach the Monastery of the Open Hand.\r\n\r\n## Chronological Major Events\r\
    \n\r\n*   The party traveled from Catur toward a long rest, heading toward The\
    \ Gale.\r\n*   A character revealed a leather satchel containing the artifact,\
    \ \"Grimero Mutandi Uder Sciencetia et Memoria.\"\r\n*   The party discussed the\
    \ nature and burden of the artifact, noting the danger of wielding absolute truth.\r\
    \n*   The party discussed spell mechanics, including spell copying, *Sentinel\
    \ Shield*, and alchemy ratios.\r\n*   The party discussed the mechanics of the\
    \ *Revivify* spell and its stipulations.\r\n*   The party discussed obtaining\
    \ assets or precious gems from the Queen for travel.\r\n*   The party discussed\
    \ various ammunition types and the properties of the *Sentinel Shield*.\r\n* \
    \  The party discussed the mechanics of spellcasting and potential enchantments.\r\
    \n*   The party successfully used a ritual to commune with nature to gain information\
    \ about the location of the monastery and the well.\r\n*   The party encountered\
    \ a white dragon emerging from the snow and engaged in combat.\r\n*   The party\
    \ received a map from a cartographer named Joshua showing the path to the Monastery\
    \ of the Open Hand.\r\n*   The party discussed the dangers of the area, including\
    \ elemental beings (Ice Methods, Air Elementals, Pyramidons, Myrmidons) and patrols\
    \ (\"father trolls\").\r\n\r\n## Key Locations\r\n\r\n- **Catur** - The location\
    \ where the party was staying before traveling toward The Gale.\r\n- **The Gale**\
    \ - A major unvisited danger/location, described as a region of torrentious winds\
    \ and snow, acting as an almost portal to the elemental plane of air.\r\n- **Monastery\
    \ of the Open Hand** - The destination the party was seeking information about;\
    \ believed to be connected to a well and located within The Gale.\r\n\r\n## Key\
    \ NPCs And Entities\r\n\r\n- **The Queen** - Ruler of the Celestial Isles; offered\
    \ assets (gems) to the party for services.\r\n- **Salazar** - A dangerous figure\
    \ attempting a hostile takeover of the realms, associated with the Wand of Wells.\r\
    \n- **The goddess of knowledge** - The divine entity associated with the artifact.\r\
    \n- **Cartographer (Joshua)** - A small gnome who provided a map showing the path\
    \ to the monastery.\r\n- **Dragon** - A white dragon that emerged from the snow,\
    \ attacked the party, and retreated.\r\n- **Patrols** - The patrols that monitor\
    \ the area.\r\n- **Elemental (Air)** - Dangerous, wild, and free elemental beings,\
    \ including Ice Methods, Air Elementals, Pyramidons, and Myrmidons.\r\n\r\n##\
    \ Combat And Encounters\r\n\r\n*   The party engaged in intense combat with a\
    \ white dragon that emerged from the snow, resulting in damage dealt by the dragon.\r\
    \n\r\n## Items Loot And Resources\r\n\r\n*   **Grimoire Mutandi Uder Sciencetia\
    \ et Memoria** - Artifact: A book of spells/knowledge tied to memory and truth;\
    \ can change reality when truth is spoken.\r\n*   **Leather Satchel** - Contained\
    \ the artifact.\r\n*   **Gems** - The party acquired assets (diamonds, emeralds,\
    \ rubies), valued at 1200 gold pieces.\r\n*   **Scroll of Magic** - Acquired during\
    \ travel.\r\n*   **Sentinel Shield** - An enchantment granting advantage on initiative/perception,\
    \ plus damage, and making it a spell guard.\r\n*   **Winged Boots** - Grants flying\
    \ speed (30 feet) for one hour, with four charges, and recharge upon a long rest.\r\
    \n*   **Alchemist jug** - Acquired by the party, capable of producing various\
    \ liquids.\r\n*   **Rough Map** - Drawn by the cartographer, showing the path\
    \ to the monastery, marked with pitfalls and places of interest.\r\n\r\n## Character\
    \ Notes\r\n\r\n*   The character who possessed the artifact felt burdened by it\
    \ and chose to hide it from the party, expressing a desire to share the truth\
    \ but fearing the consequences.\r\n*   The party discussed the mechanics of spellcasting\
    \ and potential enchantments, including the properties of the *Sentinel Shield*.\r\
    \n*   The party successfully used a ritual to commune with nature to gain information\
    \ about the location of the monastery and the well.\r\n*   The party discussed\
    \ the mechanics of flight and the dangers associated with using the Gale as a\
    \ portal.\r\n\r\n## Party Interpretations Versus World Facts\r\n\r\n*   The party\
    \ discussed the nature of spell learning, noting that Paladins are limited to\
    \ their spell list, whereas wizards can learn any spell if they have a copy.\r\
    \n*   The party joked about the alchemy jug, detailing the various liquids it\
    \ can produce (acid, basic poison, beer, honey, mayonnaise, etc.) and the volume\
    \ limits.\r\n*   The party speculated that the dragon's appearance was a warning\
    \ rather than a simple drive-by.\r\n*   The party discussed the lucrative nature\
    \ of doing tours of The Gale, noting that people pay money for the experience.\r\
    \n\r\n## Open Threads\r\n\r\n*   The specific location of the well and the Monastery\
    \ of the Open Hand within The Gale remains uncertain, though they are believed\
    \ to be in the Gale.\r\n*   The nature and control of the elemental beings (Air\
    \ Elementals, Pyramidons) and the patrols (Father Trolls) remain a point of discussion\
    \ regarding the monastery's influence.\r\n*   The full history and implications\
    \ of the song from Norhundra regarding white dragons are only partially revealed.\r\
    \n\r\n## Timeline Seeds\r\n\r\n- Ending location: Monastery of the Open Hand (within\
    \ The Gale)\r\n- Real-world date: July 5th\r\n- In-world date: July 5th\r\n\r\n\
    ## Needs Review\r\n\r\n*   The exact maximum height achievable with the winged\
    \ boots is suggested as 9,000 feet, but not precisely defined.\r\n*   The specific\
    \ details of the lore regarding the white dragons and the song from Norhundra\
    \ are still being explored.\r\n*   The exact relationship between the Monastery\
    \ and the elemental beings is unclear.\r\n*   The exact nature of the \"primordial\
    \ arcana\" and its relationship to the wells is unclear."
