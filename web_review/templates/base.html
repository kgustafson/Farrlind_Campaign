<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Farrlind Review{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='review.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="app-header">
    <a class="brand" href="/">The Farrlind Archivum</a>
    <nav class="top-nav">
      <a href="/">Dashboard</a>
    </nav>
  </header>
  <div class="app-shell">
    <aside class="archive-sidebar" aria-label="Campaign archive navigation">
      <div class="sidebar-title">
        <span>Codex Index</span>
      </div>
      <nav class="sidebar-nav">
        <a class="sidebar-link {% if request.url.path == '/' %}active{% endif %}" href="/">Dashboard</a>
        <span class="sidebar-link disabled" aria-disabled="true">Sessions</span>
        <a class="sidebar-link {% if request.url.path.startswith('/workflow') %}active{% endif %}" href="/workflow">Workflow Status</a>
        <a class="sidebar-link {% if request.url.path.startswith('/wells') %}active{% endif %}" href="/wells">Wells of Magic</a>
        <a class="sidebar-link {% if request.url.path.startswith('/npcs') %}active{% endif %}" href="/npcs">NPC Registry</a>
        <a class="sidebar-link {% if request.url.path.startswith('/locations') %}active{% endif %}" href="/locations">Locations</a>
        <a class="sidebar-link {% if request.url.path.startswith('/artifacts') %}active{% endif %}" href="/artifacts">Artifacts</a>
        <a class="sidebar-link {% if request.url.path.startswith('/combat-encounters') %}active{% endif %}" href="/combat-encounters">Combat Encounters</a>
        <span class="sidebar-link disabled" aria-disabled="true">Open Threads</span>
        <span class="sidebar-link disabled" aria-disabled="true">Faban&rsquo;s Songbook</span>
        <span class="sidebar-link disabled" aria-disabled="true">Validation Queue</span>
        <span class="sidebar-link disabled" aria-disabled="true">Campaign Timeline</span>
      </nav>
    </aside>
    <main>
      {% block content %}{% endblock %}
      <footer class="app-version">Farrlind Campaign {{ app_version() }}</footer>
    </main>
  </div>
</body>
</html>
