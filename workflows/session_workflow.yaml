workflow:
  id: farrlind_session_canon
  version: 2
  display_name: Campaign Session Canon Workflow
  scope: per_session
  description: >
    Deterministic workflow for moving a campaign session from source material
    through draft extraction, human review, database load, canon outputs,
    verification, and versioned project history.
  state_persistence: database
  definition_format: yaml
  default_session_ref: sessionXX
  safety_rules:
    - AI-generated transcript, extraction, summary, and validation artifacts are draft/source material.
    - Reviewed or applied canon must never be overwritten automatically.
    - Any rerun that changes canon must pass through human review before it is applied.
    - Human gates must stay explicit in the web UI and CLI.
    - Versioned project changes should update version.md, revision.md, receive a matching Git tag, and be pushed.

steps:
  - id: source_audio_registered
    display_name: Source Audio Registered
    lane: intake
    dependencies: []
    command: null
    expected_inputs:
      - campaigns/{campaign}/audio/sessionXX.*
    expected_outputs:
      - campaigns/{campaign}/audio/sessionXX.*
    status_rules:
      complete_when:
        - campaigns/{campaign}/audio/sessionXX.wav or sessionXX.mp3 exists
      blocked_when:
        - audio file is missing and no transcript/diary-only fallback is declared
    gate: operator_supplied
    rerun_policy: safe
    canon_impact: none
    notes: Optional for older reviewed sessions that only have diary/source text.

  - id: transcribe_audio
    display_name: Transcribe Audio
    lane: intake
    dependencies:
      - source_audio_registered
    command: ./rag-env/bin/python scripts/rag.py transcribe sessionXX
    expected_inputs:
      - campaigns/{campaign}/audio/sessionXX.*
    expected_outputs:
      - campaigns/{campaign}/raw/sessionXX_transcript.txt
    status_rules:
      complete_when:
        - raw transcript exists
      stale_when:
        - audio mtime is newer than transcript mtime
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: source_material
    notes: Uses production two-worker parallel transcription by default.

  - id: diary_source_available
    display_name: Diary Source Available
    lane: intake
    dependencies: []
    command: null
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_diary.md
    expected_outputs:
      - campaigns/{campaign}/clean/sessionXX_diary.md
    status_rules:
      complete_when:
        - diary source exists
      optional_when:
        - transcript exists and no diary source exists
    gate: operator_supplied
    rerun_policy: safe
    canon_impact: source_material
    notes: Older sessions may rely primarily on diary source.

  - id: source_status_check
    display_name: Source Status Check
    lane: intake
    dependencies:
      - transcribe_audio
      - diary_source_available
    dependency_mode: any
    command: ./rag-env/bin/python scripts/rag.py status sessionXX
    expected_inputs:
      - campaigns/{campaign}/audio/sessionXX.*
      - campaigns/{campaign}/raw/sessionXX_transcript.txt
      - campaigns/{campaign}/clean/sessionXX_diary.md
    expected_outputs:
      - operator status report
    status_rules:
      complete_when:
        - at least one usable source artifact exists
    gate: safe_diagnostic
    rerun_policy: safe
    canon_impact: none

  - id: curate_transcript
    display_name: Draft Canon Packet With Gemma
    lane: draft_generation
    dependencies:
      - source_status_check
    command: ./rag-env/bin/python scripts/rag.py curate sessionXX
    expected_inputs:
      - campaigns/{campaign}/raw/sessionXX_transcript.txt
      - campaigns/{campaign}/sessions/sessionXX_context.yaml
      - campaigns/{campaign}/final/session##_summary.md
    expected_outputs:
      - campaigns/{campaign}/clean/sessionXX_curated.md
      - campaigns/{campaign}/clean/sessionXX_curated_metadata.json
      - campaigns/{campaign}/clean/sessionXX_curated_chunks/chunk_*.md
    status_rules:
      complete_when:
        - draft canon packet exists
      stale_when:
        - raw transcript mtime is newer than curated draft packet mtime
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only
    notes: >
      Uses gemma4:e2b by default via FARRLIND_CURATION_MODEL to produce a
      draft canon packet: narrative summary, major events, NPCs/entities,
      locations, artifacts/items, lore items, combat encounters, open threads,
      timeline notes, and inventory/resource notes.

  - id: generate_narrative_summary
    display_name: Generate Narrative Summary
    lane: draft_generation
    dependencies:
      - curate_transcript
    command: ./rag-env/bin/python scripts/rag.py generate-narrative-summary sessionXX
    expected_inputs:
      - campaigns/{campaign}/campaign.yaml
      - campaigns/{campaign}/raw/sessionXX_transcript.txt
      - campaigns/{campaign}/clean/sessionXX_curated.md
      - campaigns/{campaign}/clean/sessionXX_diary.md
      - campaigns/{campaign}/sessions/sessionXX_context.yaml
    expected_outputs:
      - campaigns/{campaign}/clean/sessionXX_narrative.md
      - campaigns/{campaign}/clean/sessionXX_narrative_metadata.json
      - campaigns/{campaign}/clean/sessionXX_narrative_chunks/chunk_*.md
    status_rules:
      complete_when:
        - narrative draft exists
      stale_when:
        - raw transcript or curated packet mtime is newer than narrative draft mtime
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only
    notes: >
      Step 6 synthesis pass. It may use only artifacts available from steps 1-5:
      campaign config/glossary, raw transcript, curated packet, optional diary
      source, and optional session context. It must not use database canon,
      reviewed extraction files, draft event files, final summaries, or later
      review artifacts.

  - id: extract_session_spine
    display_name: Extract Session Spine
    lane: draft_generation
    dependencies:
      - generate_narrative_summary
    command: ./rag-env/bin/python scripts/rag.py extract-session-spine sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_narrative.md
    expected_outputs:
      - campaigns/{campaign}/clean/sessionXX_spine.yaml
      - campaigns/{campaign}/clean/sessionXX_spine_metadata.yaml
    status_rules:
      complete_when:
        - session spine YAML exists
      stale_when:
        - narrative draft mtime is newer than spine YAML mtime
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only
    notes: >
      Step 7 spine pass. Turns the step 6 narrative draft into ordered major
      chronological event buckets for later event review and bucketing.

  - id: validate_session_spine
    display_name: Validate Session Spine
    lane: draft_generation
    dependencies:
      - extract_session_spine
    command: ./rag-env/bin/python scripts/rag.py validate-session-spine sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_spine.yaml
      - campaigns/{campaign}/clean/sessionXX_narrative.md
      - campaigns/{campaign}/clean/sessionXX_curated.md
      - campaigns/{campaign}/raw/sessionXX_transcript.txt
      - campaigns/{campaign}/campaign.yaml
    expected_outputs:
      - campaigns/{campaign}/clean/sessionXX_spine_validation.md
    status_rules:
      complete_when:
        - session spine validation report exists
      stale_when:
        - session spine YAML or narrative draft mtime is newer than spine validation report mtime
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only
    notes: >
      Step 8 validation pass. Checks the session spine against only artifacts
      available through step 7, including the raw transcript, curated packet,
      narrative draft, and campaign config. It flags missing support, missing
      obvious beats, and party-interpretation versus world-fact issues before
      downstream event/entity extraction.

  - id: extract_npcs
    display_name: Extract NPCs
    lane: entity_extraction
    dependencies:
      - validate_session_spine
    command: ./rag-env/bin/python scripts/rag.py extract-npcs sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_spine.yaml
      - campaigns/{campaign}/clean/sessionXX_narrative.md
      - campaigns/{campaign}/clean/sessionXX_curated.md
      - campaigns/{campaign}/final/sessionXX_summary.md
      - campaigns/{campaign}/clean/sessionXX_diary.md
      - campaigns/{campaign}/raw/sessionXX_transcript.txt
    expected_outputs:
      - campaigns/{campaign}/extracted/sessionXX_npcs.json
      - campaigns/{campaign}/extracted/sessionXX_npcs_metadata.json
    status_rules:
      complete_when:
        - NPC extraction JSON exists
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only
    notes: Uses compact per-chunk registry context for large raw transcript extraction.

  - id: extract_locations
    display_name: Extract Locations
    lane: entity_extraction
    dependencies:
      - validate_session_spine
    command: ./rag-env/bin/python scripts/rag.py extract-locations sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_spine.yaml
      - campaigns/{campaign}/clean/sessionXX_narrative.md
      - campaigns/{campaign}/clean/sessionXX_curated.md
      - campaigns/{campaign}/final/sessionXX_summary.md
      - campaigns/{campaign}/clean/sessionXX_diary.md
      - campaigns/{campaign}/raw/sessionXX_transcript.txt
    expected_outputs:
      - campaigns/{campaign}/extracted/sessionXX_locations.json
      - campaigns/{campaign}/extracted/sessionXX_locations_metadata.json
    status_rules:
      complete_when:
        - location extraction JSON exists
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only
    notes: Uses compact per-chunk registry context for large raw transcript extraction.

  - id: extract_artifacts
    display_name: Extract Artifacts
    lane: entity_extraction
    dependencies:
      - validate_session_spine
    command: ./rag-env/bin/python scripts/rag.py extract-artifacts sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_spine.yaml
      - campaigns/{campaign}/clean/sessionXX_narrative.md
      - campaigns/{campaign}/clean/sessionXX_curated.md
      - campaigns/{campaign}/final/sessionXX_summary.md
      - campaigns/{campaign}/clean/sessionXX_diary.md
      - campaigns/{campaign}/raw/sessionXX_transcript.txt
    expected_outputs:
      - campaigns/{campaign}/extracted/sessionXX_artifacts.json
      - campaigns/{campaign}/extracted/sessionXX_artifacts_metadata.json
    status_rules:
      complete_when:
        - artifact extraction JSON exists
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only
    notes: Uses compact per-chunk location context for large raw transcript extraction.

  - id: extract_lore_items
    display_name: Extract Lore Items
    lane: entity_extraction
    dependencies:
      - validate_session_spine
    command: ./rag-env/bin/python scripts/rag.py extract-lore-items sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_spine.yaml
      - campaigns/{campaign}/clean/sessionXX_narrative.md
      - campaigns/{campaign}/clean/sessionXX_curated.md
      - campaigns/{campaign}/final/sessionXX_summary.md
      - campaigns/{campaign}/clean/sessionXX_diary.md
      - campaigns/{campaign}/raw/sessionXX_transcript.txt
    expected_outputs:
      - campaigns/{campaign}/extracted/sessionXX_lore_items.json
      - campaigns/{campaign}/extracted/sessionXX_lore_items_metadata.json
    status_rules:
      complete_when:
        - lore item extraction JSON exists
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only
    notes: Uses compact per-chunk registry context for large raw transcript extraction.

  - id: extract_combat_encounters
    display_name: Extract Combat Encounters
    lane: entity_extraction
    dependencies:
      - validate_session_spine
    command: ./rag-env/bin/python scripts/rag.py extract-combat-encounters sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_spine.yaml
      - campaigns/{campaign}/clean/sessionXX_narrative.md
      - campaigns/{campaign}/clean/sessionXX_curated.md
      - campaigns/{campaign}/final/sessionXX_summary.md
      - campaigns/{campaign}/clean/sessionXX_diary.md
      - campaigns/{campaign}/raw/sessionXX_transcript.txt
    expected_outputs:
      - campaigns/{campaign}/extracted/sessionXX_combat_encounters.json
      - campaigns/{campaign}/extracted/sessionXX_combat_encounters_metadata.json
    status_rules:
      complete_when:
        - combat encounter extraction JSON exists
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only

  - id: extract_open_threads
    display_name: Extract Open Threads
    lane: entity_extraction
    dependencies:
      - validate_session_spine
    command: ./rag-env/bin/python scripts/rag.py extract-open-threads sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_spine.yaml
      - campaigns/{campaign}/clean/sessionXX_narrative.md
      - campaigns/{campaign}/clean/sessionXX_curated.md
      - campaigns/{campaign}/final/sessionXX_summary.md
      - campaigns/{campaign}/clean/sessionXX_diary.md
      - campaigns/{campaign}/raw/sessionXX_transcript.txt
    expected_outputs:
      - campaigns/{campaign}/extracted/sessionXX_open_threads.json
      - campaigns/{campaign}/extracted/sessionXX_open_threads_metadata.json
    status_rules:
      complete_when:
        - open thread extraction JSON exists
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only

  - id: extract_events
    display_name: Extract Events
    lane: draft_generation
    dependencies:
      - extract_npcs
      - extract_locations
      - extract_artifacts
      - extract_lore_items
      - extract_combat_encounters
      - extract_open_threads
    command: ./rag-env/bin/python scripts/rag.py extract sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_spine.yaml
      - campaigns/{campaign}/clean/sessionXX_narrative.md
      - campaigns/{campaign}/clean/sessionXX_curated.md
      - campaigns/{campaign}/raw/sessionXX_transcript.txt
      - campaigns/{campaign}/clean/sessionXX_diary.md
      - campaigns/{campaign}/extracted/sessionXX_npcs.json
      - campaigns/{campaign}/extracted/sessionXX_locations.json
      - campaigns/{campaign}/extracted/sessionXX_artifacts.json
      - campaigns/{campaign}/extracted/sessionXX_lore_items.json
      - campaigns/{campaign}/extracted/sessionXX_combat_encounters.json
      - campaigns/{campaign}/extracted/sessionXX_open_threads.json
    expected_outputs:
      - campaigns/{campaign}/clean/sessionXX_events.md
    status_rules:
      complete_when:
        - events draft exists
      stale_when:
        - source artifact mtime is newer than events draft mtime
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only
    notes: >
      Runs after entity extraction so event records can be shaped by the
      session spine, clean narrative, and draft entity context.

  - id: filter_events
    display_name: Filter Events
    lane: draft_generation
    dependencies:
      - extract_events
    command: ./rag-env/bin/python scripts/rag.py filter sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_events.md
    expected_outputs:
      - campaigns/{campaign}/clean/sessionXX_filtered.md
    status_rules:
      complete_when:
        - filtered draft exists
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only

  - id: classify_events
    display_name: Classify Events
    lane: draft_generation
    dependencies:
      - filter_events
    command: ./rag-env/bin/python scripts/rag.py classify sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_filtered.md
    expected_outputs:
      - campaigns/{campaign}/clean/sessionXX_classified.md
    status_rules:
      complete_when:
        - classified draft exists
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only

  - id: normalize_events
    display_name: Normalize Events
    lane: draft_generation
    dependencies:
      - classify_events
    command: ./rag-env/bin/python scripts/rag.py normalize sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_classified.md
      - campaigns/{campaign}/sessions/sessionXX_context.yaml
    expected_outputs:
      - campaigns/{campaign}/clean/sessionXX_normalized.md
    status_rules:
      complete_when:
        - normalized draft exists
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only

  - id: merge_events
    display_name: Merge Events
    lane: draft_generation
    dependencies:
      - normalize_events
    command: ./rag-env/bin/python scripts/rag.py merge sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_normalized.md
    expected_outputs:
      - campaigns/{campaign}/clean/sessionXX_merged.md
    status_rules:
      complete_when:
        - merged draft exists
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only

  - id: validate_draft
    display_name: Validate Draft
    lane: draft_generation
    dependencies:
      - merge_events
    command: ./rag-env/bin/python scripts/rag.py validate sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_merged.md
    expected_outputs:
      - campaigns/{campaign}/clean/sessionXX_validation.md
    status_rules:
      complete_when:
        - validation draft exists
    gate: safe_diagnostic
    rerun_policy: safe_before_review
    canon_impact: draft_only

  - id: summarize_draft
    display_name: Summarize Draft
    lane: draft_generation
    dependencies:
      - validate_draft
    command: ./rag-env/bin/python scripts/rag.py summarize sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_merged.md
      - campaigns/{campaign}/clean/sessionXX_diary.md
      - campaigns/{campaign}/notes/sessionXX_corrections.md
    expected_outputs:
      - campaigns/{campaign}/clean/sessionXX_summary.md
    status_rules:
      complete_when:
        - draft ingest summary exists
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only

  - id: postextract_shortcut
    display_name: Postextract Shortcut
    lane: draft_generation
    dependencies:
      - extract_events
    command: ./rag-env/bin/python scripts/rag.py postextract sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_events.md
    expected_outputs:
      - campaigns/{campaign}/clean/sessionXX_filtered.md
      - campaigns/{campaign}/clean/sessionXX_classified.md
      - campaigns/{campaign}/clean/sessionXX_normalized.md
      - campaigns/{campaign}/clean/sessionXX_merged.md
      - campaigns/{campaign}/clean/sessionXX_validation.md
      - campaigns/{campaign}/clean/sessionXX_summary.md
    status_rules:
      complete_when:
        - all postextract outputs exist
    gate: automatic_allowed_before_review
    rerun_policy: safe_before_review
    canon_impact: draft_only
    notes: Shortcut for filter, classify, normalize, merge, validate, and summarize.

  - id: review_npc_extraction
    display_name: Review NPC Extraction
    lane: human_review
    dependencies:
      - extract_npcs
    command: web_review /npcs/extractions
    expected_inputs:
      - campaigns/{campaign}/extracted/sessionXX_npcs.json
    expected_outputs:
      - campaigns/{campaign}/extracted/sessionXX_npcs_reviewed.json
      - database npc rows
    status_rules:
      complete_when:
        - NPC extraction review decisions have been applied or explicitly skipped
    gate: human_required
    rerun_policy: edit_until_reviewed
    canon_impact: review_record_and_registry_rows

  - id: review_location_extraction
    display_name: Review Location Extraction
    lane: human_review
    dependencies:
      - extract_locations
    command: web_review /locations/extractions
    expected_inputs:
      - campaigns/{campaign}/extracted/sessionXX_locations.json
    expected_outputs:
      - campaigns/{campaign}/extracted/sessionXX_locations_reviewed.json
      - database location rows
    status_rules:
      complete_when:
        - Location extraction review decisions have been applied or explicitly skipped
    gate: human_required
    rerun_policy: edit_until_reviewed
    canon_impact: review_record_and_registry_rows

  - id: review_artifact_extraction
    display_name: Review Artifact Extraction
    lane: human_review
    dependencies:
      - extract_artifacts
    command: web_review /artifacts/extractions
    expected_inputs:
      - campaigns/{campaign}/extracted/sessionXX_artifacts.json
    expected_outputs:
      - campaigns/{campaign}/extracted/sessionXX_artifacts_reviewed.json
      - database artifact rows
    status_rules:
      complete_when:
        - Artifact extraction review decisions have been applied or explicitly skipped
    gate: human_required
    rerun_policy: edit_until_reviewed
    canon_impact: review_record_and_registry_rows

  - id: review_lore_item_extraction
    display_name: Review Lore Item Extraction
    lane: human_review
    dependencies:
      - extract_lore_items
    command: web_review /lore-items/extractions
    expected_inputs:
      - campaigns/{campaign}/extracted/sessionXX_lore_items.json
    expected_outputs:
      - campaigns/{campaign}/extracted/sessionXX_lore_items_reviewed.json
      - database lore item rows
    status_rules:
      complete_when:
        - Lore item extraction review decisions have been applied or explicitly skipped
    gate: human_required
    rerun_policy: edit_until_reviewed
    canon_impact: review_record_and_registry_rows

  - id: review_combat_encounter_extraction
    display_name: Review Combat Encounter Extraction
    lane: human_review
    dependencies:
      - extract_combat_encounters
    command: web_review /combat-encounters/extractions
    expected_inputs:
      - campaigns/{campaign}/extracted/sessionXX_combat_encounters.json
    expected_outputs:
      - campaigns/{campaign}/extracted/sessionXX_combat_encounters_reviewed.json
      - database encounter and enemy rows
    status_rules:
      complete_when:
        - Combat encounter extraction review decisions have been applied or explicitly skipped
    gate: human_required
    rerun_policy: edit_until_reviewed
    canon_impact: review_record_and_registry_rows

  - id: review_open_thread_extraction
    display_name: Review Open Thread Extraction
    lane: human_review
    dependencies:
      - extract_open_threads
    command: web_review /open-threads/extractions
    expected_inputs:
      - campaigns/{campaign}/extracted/sessionXX_open_threads.json
    expected_outputs:
      - campaigns/{campaign}/extracted/sessionXX_open_threads_reviewed.json
      - database open thread rows
    status_rules:
      complete_when:
        - Open thread extraction review decisions have been applied or explicitly skipped
    gate: human_required
    rerun_policy: edit_until_reviewed
    canon_impact: review_record_and_registry_rows

  - id: initialize_review
    display_name: Initialize Final Summary Review
    lane: human_review
    dependencies:
      - summarize_draft
      - review_npc_extraction
      - review_location_extraction
      - review_artifact_extraction
      - review_lore_item_extraction
      - review_combat_encounter_extraction
      - review_open_thread_extraction
    command: ./rag-env/bin/python scripts/dm_query.py init-review sessionXX
    expected_inputs:
      - campaigns/{campaign}/clean/sessionXX_spine.yaml
      - campaigns/{campaign}/clean/sessionXX_merged.md
      - campaigns/{campaign}/clean/sessionXX_summary.md
      - campaigns/{campaign}/clean/sessionXX_events.md
      - reviewed entity extraction decisions
    expected_outputs:
      - campaigns/{campaign}/reviews/sessionXX_review.yaml
    status_rules:
      complete_when:
        - review YAML exists
      blocked_when:
        - review YAML already exists unless operator confirms overwrite/reopen path
    gate: human_initiated
    rerun_policy: protected
    canon_impact: none
    notes: >
      Creates the review file for the final summary composition workspace.
      Draft narrative, spine, entity extraction outputs, micro-events, and
      source snippets are supporting evidence; the reviewed final narrative is
      the primary canon artifact.

  - id: edit_review_decisions
    display_name: Compose Final Summary
    lane: human_review
    dependencies:
      - initialize_review
    command: web_review /sessions/sessionXX/review
    expected_inputs:
      - campaigns/{campaign}/reviews/sessionXX_review.yaml
      - source artifacts and draft outputs
    expected_outputs:
      - campaigns/{campaign}/reviews/sessionXX_review.yaml
    status_rules:
      complete_when:
        - final summary draft has been written
        - session title, real-world date, in-world date, starting location, and ending location are filled
        - unresolved placeholders are removed
    gate: human_required
    rerun_policy: edit_until_reviewed
    canon_impact: review_record
    notes: >
      Replaces the old macro-event bucketing and micro-event resolution tail.
      Micro-events remain visible as copy/reference evidence while the human
      writes the canonical narrative summary.

  - id: validate_final_summary
    display_name: Validate Final Summary
    lane: human_review
    dependencies:
      - edit_review_decisions
    command: web_review validation panel / health
    expected_inputs:
      - campaigns/{campaign}/reviews/sessionXX_review.yaml
    expected_outputs:
      - validation notes in web review
    status_rules:
      complete_when:
        - final summary required fields are filled
        - no unresolved placeholder text remains
    gate: safe_diagnostic
    rerun_policy: safe
    canon_impact: none

  - id: mark_reviewed
    display_name: Mark Final Summary Reviewed
    lane: human_review
    dependencies:
      - validate_final_summary
    command: web_review mark reviewed action
    expected_inputs:
      - campaigns/{campaign}/reviews/sessionXX_review.yaml
    expected_outputs:
      - campaigns/{campaign}/reviews/sessionXX_review.yaml
    status_rules:
      complete_when:
        - review status is reviewed
      blocked_when:
        - final summary required fields are missing
        - final summary contains unresolved placeholders
    gate: human_required
    rerun_policy: safe_if_not_applied
    canon_impact: review_record

  - id: apply_review
    display_name: Apply Reviewed Session To Database
    lane: canonization
    dependencies:
      - mark_reviewed
    command: ./rag-env/bin/python scripts/dm_query.py apply-review sessionXX
    expected_inputs:
      - campaigns/{campaign}/reviews/sessionXX_review.yaml
      - campaigns/{campaign}/final/session*_summary.md
      - campaigns/{campaign}/travel.yaml
      - campaigns/{campaign}/encounters.yaml
      - campaigns/{campaign}/enemy_encounters.yaml
      - campaigns/{campaign}/lore/*.md
    expected_outputs:
      - campaigns/{campaign}/final/sessionXX_summary.md
      - farrlind/out/load_summaries.sql
      - database rows
      - review YAML marked applied
    status_rules:
      complete_when:
        - review status is applied
        - database load succeeds
      blocked_when:
        - review status is not reviewed
    gate: human_required
    rerun_policy: canon_affecting_requires_confirmation
    canon_impact: database_canon
    notes: >
      For final-summary reviews, apply writes the reviewed narrative to the
      final summary file before loading the database so session and timeline
      canon come from the human-reviewed summary.

  - id: write_final_summary
    display_name: Write/Publish Final Summary
    lane: canonization
    dependencies:
      - apply_review
    command: ./rag-env/bin/python scripts/dm_query.py write-final-summary sessionXX
    expected_inputs:
      - applied review state
      - reviewed final summary text and timeline fields
    expected_outputs:
      - campaigns/{campaign}/final/sessionXX_summary.md
    status_rules:
      complete_when:
        - final summary exists
      blocked_when:
        - review has not been applied
    gate: human_required
    rerun_policy: canon_affecting_requires_confirmation
    canon_impact: canon_file
    notes: >
      Publishes the reviewed final summary markdown. In the final-summary
      workflow this is idempotent after apply, because apply writes the reviewed
      narrative before the database load.

  - id: update_lore_sections
    display_name: Update Cross-Session Lore Sections
    lane: canonization
    dependencies:
      - write_final_summary
    command: web_review lore and registry pages
    expected_inputs:
      - campaigns/{campaign}/final/sessionXX_summary.md
      - reviewed decisions
      - database canon rows
    expected_outputs:
      - campaigns/{campaign}/lore/wells_of_magic.md
      - registry database edits for NPCs, locations, artifacts, and future lore sections
    status_rules:
      complete_when:
        - operator confirms relevant lore/registry edits are complete or not needed
    gate: human_required
    rerun_policy: canon_affecting_requires_confirmation
    canon_impact: canon_file_or_database_canon
    notes: Includes committing lore after review when lore files change.

  - id: dbload_refresh
    display_name: Refresh Canon Database Load
    lane: verification
    dependencies:
      - write_final_summary
      - update_lore_sections
    dependency_mode: all_completed_or_not_applicable
    command: ./rag-env/bin/python scripts/rag.py dbload --apply
    expected_inputs:
      - campaigns/{campaign}/final/session*_summary.md
      - campaigns/{campaign}/travel.yaml
      - campaigns/{campaign}/encounters.yaml
      - campaigns/{campaign}/enemy_encounters.yaml
      - campaigns/{campaign}/lore/*.md
    expected_outputs:
      - farrlind/out/load_summaries.sql
      - database rows
    status_rules:
      complete_when:
        - command exits zero
        - generated SQL is current enough for operator needs
    gate: human_initiated
    rerun_policy: canon_affecting_requires_confirmation
    canon_impact: database_canon

  - id: run_health
    display_name: Run Canon Health
    lane: verification
    dependencies:
      - dbload_refresh
    command: ./rag-env/bin/python scripts/dm_query.py health
    expected_inputs:
      - database rows
      - reviewed canon files
    expected_outputs:
      - health report
    status_rules:
      complete_when:
        - command exits zero
        - no blocking health notes remain
    gate: safe_diagnostic
    rerun_policy: safe
    canon_impact: none

  - id: run_tests
    display_name: Run Automated Tests
    lane: verification
    dependencies:
      - run_health
    command: ./rag-env/bin/python -m unittest tests/test_web_review.py tests/test_dm_query.py tests/test_load_summaries.py tests/test_farrlind_pipeline.py tests/test_transcription_benchmark.py tests/test_parallel_transcription.py tests/test_workflow_definition.py tests/test_workflow_state.py
    expected_inputs:
      - source code
      - workflow definition
      - test fixtures
    expected_outputs:
      - test result report
    status_rules:
      complete_when:
        - full relevant test suite exits zero
    gate: safe_diagnostic
    rerun_policy: safe
    canon_impact: none

  - id: web_smoke_check
    display_name: Web App Smoke Check
    lane: verification
    dependencies:
      - run_tests
    command: docker compose up --build -d web && curl local web routes
    expected_inputs:
      - web_review app
      - farrlind/docker-compose.yml
    expected_outputs:
      - local route checks return HTTP 200
    status_rules:
      complete_when:
        - dashboard, review, registry, lore, and relevant API routes return expected status codes
    gate: safe_diagnostic
    rerun_policy: safe
    canon_impact: none

  - id: version_revision_update
    display_name: Update Version And Revision Notes
    lane: version_control
    dependencies:
      - run_tests
      - web_smoke_check
    dependency_mode: all_completed_or_not_applicable
    command: edit version.md and revision.md
    expected_inputs:
      - completed code/canon/workflow changes
    expected_outputs:
      - version.md
      - revision.md
    status_rules:
      complete_when:
        - version.md matches latest revision entry
        - revision.md describes the change
    gate: human_or_agent_required
    rerun_policy: safe
    canon_impact: project_metadata

  - id: git_commit
    display_name: Commit Project Changes
    lane: version_control
    dependencies:
      - version_revision_update
    command: git add ... && git commit -m "..."
    expected_inputs:
      - verified working tree changes
      - version.md
      - revision.md
      - changed canon/lore/code/docs files
    expected_outputs:
      - git commit
    status_rules:
      complete_when:
        - git commit succeeds
        - working tree contains no uncommitted intended changes
    gate: human_or_agent_required
    rerun_policy: safe_if_not_duplicate
    canon_impact: versioned_project_history

  - id: git_tag
    display_name: Tag Project Version
    lane: version_control
    dependencies:
      - git_commit
    command: git tag vMAJOR.MINOR.REVISION
    expected_inputs:
      - git commit containing matching version.md and revision.md updates
    expected_outputs:
      - git tag
    status_rules:
      complete_when:
        - matching git tag exists and points at the versioned commit
    gate: human_or_agent_required
    rerun_policy: safe_if_tag_missing
    canon_impact: versioned_project_history

  - id: git_push
    display_name: Push Commit And Tag
    lane: version_control
    dependencies:
      - git_tag
    command: git push && git push origin vMAJOR.MINOR.REVISION
    expected_inputs:
      - local commit
      - local tag
    expected_outputs:
      - GitHub main branch updated
      - GitHub tag pushed
    status_rules:
      complete_when:
        - branch push succeeds
        - tag push succeeds
    gate: human_or_agent_required
    rerun_policy: safe_if_remote_missing
    canon_impact: versioned_project_history

lanes:
  - id: intake
    display_name: Source Intake
  - id: draft_generation
    display_name: Draft Generation
  - id: entity_extraction
    display_name: Entity Extraction
  - id: human_review
    display_name: Human Review
    implementation_status: in_progress
    notes: >
      Web review gates now cover extraction review pages first, followed by the
      YAML-backed session event review page, then mark-reviewed and apply.
  - id: canonization
    display_name: Canonization
  - id: verification
    display_name: Testing And Verification
  - id: version_control
    display_name: Version Control
