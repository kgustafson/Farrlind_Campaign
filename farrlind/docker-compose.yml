services:

  db:
    image: postgres:16
    container_name: farrlind_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       farrlind
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: gofaban   # change before any exposure
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d   # SQL files here run on first boot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d farrlind"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: farrlind_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: farrlind_web
    restart: unless-stopped
    environment:
      FARRLIND_DATABASE_URL: postgresql+psycopg2://admin:gofaban@db:5432/farrlind
      FARRLIND_INTERFACE_MODE: ${FARRLIND_INTERFACE_MODE:-edit}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    command: python -m uvicorn web_review.app:app --host 0.0.0.0 --port 8000

  web_archive:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: farrlind_archive
    restart: unless-stopped
    environment:
      FARRLIND_DATABASE_URL: postgresql+psycopg2://admin:gofaban@db:5432/farrlind
      FARRLIND_INTERFACE_MODE: archive
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ..:/app:ro
    ports:
      - "8002:8000"
    command: python -m uvicorn web_review.app:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
