services:

  db:
    image: postgres:16
    container_name: farrlind_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       farrlind
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: gofaban   # change before any exposure
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d   # SQL files here run on first boot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farrlind_user -d farrlind"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: farrlind_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
